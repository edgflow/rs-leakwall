[package]
name = "leakwall"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = { version = "1", optional = true }
ureq = { version = "3", features = ["json"], optional = true }

[features]
llm = ["dep:ureq", "dep:serde_json"]
